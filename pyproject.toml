[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drift-drought"
version = "0.1.0"
description = "DRIFT: space-time drought events selected from the component tree of a deficit field"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Karel A. Sanchez H." }]
keywords = ["drought", "event detection", "component tree", "topological persistence", "tracking", "hydrology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "numba>=0.58",
    "higra>=0.6",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "xarray>=2023.1",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]
docs = ["sphinx>=7", "sphinx-rtd-theme>=2", "matplotlib>=3.7"]

[project.urls]
Documentation = "https://drift-drought.readthedocs.io"
Source = "https://github.com/TODO/drift-drought"

[tool.hatch.build.targets.wheel]
packages = ["src/driftdrought"]

[tool.pytest.ini_options]
testpaths = ["tests"]
